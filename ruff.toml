# Ruff configuration (Zenotika V4 - Concurrency Safe)
line-length = 100
target-version = "py313"

[lint]
# B: Bugbear (Safety - catches mutable defaults B006)
# E, F: Pyflakes/Pycodestyle (Standard)
# I: Isort (Imports)
# RUF: Ruff specific (Async/Await safety)
# SIM: Simplification
select = ["E", "F", "I", "B", "RUF", "SIM"]
ignore = ["B008"]

[lint.per-file-ignores]
"migrations/**/*.py" = ["E501"]
"backend/app/services/report.py" = ["E501"]
"backend/app/services/seeds.py" = ["E501"]
"backend/app/i18n/id_styles.py" = ["E501"]
"backend/app/main.py" = ["E501"]
"backend/app/models/klsi.py" = ["E501"]
"backend/app/services/rollup.py" = ["E501"]
"backend/app/services/validation.py" = ["E501"]
"backend/app/routers/*.py" = ["E501"]
"backend/app/data/*.py" = ["E501"]
