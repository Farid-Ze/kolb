version: '3.9'
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: klsi
      POSTGRES_PASSWORD: klsi
      POSTGRES_DB: klsi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://klsi:klsi@db:5432/klsi
      JWT_SECRET_KEY: change-me
      ENV: prod
    depends_on:
      - db
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    depends_on:
      - api
    ports:
      - "3000:80"
volumes:
  pgdata: {}
