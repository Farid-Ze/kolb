<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenotika - The Tunnel Assessment (Ipsative Core)</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --hud-blue: #0ea5e9; /* Citrix Blue */
            --hud-purple: #a855f7; /* Zenotika Purple */
            --rank-1: #ef4444; /* Least */
            --rank-4: #22c55e; /* Most */
        }

        body {
            background-color: #121212;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }

        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
        .font-header { font-family: 'Oswald', sans-serif; }

        /* Card Animations */
        .card-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .card-exit { animation: slideOut 0.3s cubic-bezier(0.7, 0, 0.84, 0) forwards; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slideOut {
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }

        /* Rank Badge */
        .rank-badge {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .rank-badge.scale-in {
            transform: scale(1);
            opacity: 1;
        }
        .rank-badge.hidden {
            transform: scale(0);
            opacity: 0;
        }

        /* Sorting Slots */
        .sort-slot {
            transition: border-color 0.2s, background-color 0.2s;
        }
        .sort-slot.active {
            border-color: var(--hud-blue);
            background-color: rgba(14, 165, 233, 0.1);
        }

        /* FigJam Background */
        .bg-dots {
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const Icon = ({ name, size = 18, className }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- BACKGROUND: The "Focus Tunnel" ---
        const FocusTunnel = ({ intensity = 1, color = 0x0ea5e9 }) => {
            const mountRef = useRef(null);
            
            useEffect(() => {
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;
                const scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x050505, 0.05);

                const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                camera.position.z = 10;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(width, height);
                mountRef.current.appendChild(renderer.domElement);

                // Grid Tunnel
                const geometry = new THREE.CylinderGeometry(20, 20, 200, 32, 20, true);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x1a1a1a, 
                    wireframe: true, 
                    transparent: true, 
                    opacity: 0.15 
                });
                const tunnel = new THREE.Mesh(geometry, material);
                tunnel.rotation.x = Math.PI / 2;
                scene.add(tunnel);

                // Particles
                const pGeometry = new THREE.BufferGeometry();
                const pCount = 300;
                const pPos = new Float32Array(pCount * 3);
                for(let i=0; i<pCount; i++) {
                    pPos[i*3] = (Math.random() - 0.5) * 40;
                    pPos[i*3+1] = (Math.random() - 0.5) * 40;
                    pPos[i*3+2] = (Math.random() * 100) - 50;
                }
                pGeometry.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
                const pMaterial = new THREE.PointsMaterial({ color: color, size: 0.08, opacity: 0.6, transparent: true });
                const particles = new THREE.Points(pGeometry, pMaterial);
                scene.add(particles);

                let reqId;
                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    // Speed based on intensity
                    const speed = 0.05 * intensity;
                    
                    tunnel.position.z += speed;
                    if(tunnel.position.z > 5) tunnel.position.z = -5;

                    particles.position.z += speed * 3;
                    if(particles.position.z > 10) particles.position.z = -40;

                    tunnel.rotation.y += 0.001 * intensity;
                    renderer.render(scene, camera);
                };
                animate();

                return () => { 
                    cancelAnimationFrame(reqId);
                    if(mountRef.current) mountRef.current.innerHTML = ''; 
                };
            }, [intensity, color]);

            return <div ref={mountRef} className="absolute inset-0 z-0 transition-colors duration-1000 bg-gradient-to-b from-black via-[#0a0a0a] to-black" />;
        };

        // --- COMPONENT: RPM Bar (Progress) ---
        const TelemetryBar = ({ current, total, phase }) => {
            const progress = (current / total);
            const segments = 24;
            const filled = Math.floor(progress * segments);
            
            // Phase 1: Blue/Green, Phase 2 (Context): Purple/Orange
            const activeColor = phase === 'context' ? 'bg-purple-500' : 'bg-blue-500';

            return (
                <div className="flex items-center gap-4 w-full max-w-2xl mx-auto mb-6 opacity-90">
                    <div className="font-mono-tech text-[10px] text-gray-500 w-16 text-right flex flex-col leading-tight">
                        <span>DATA</span>
                        <span className="text-white">SYNC</span>
                    </div>
                    <div className="flex-1 flex gap-[2px] h-2 bg-gray-900/50 p-[1px] rounded border border-gray-800">
                        {[...Array(segments)].map((_, i) => (
                            <div 
                                key={i} 
                                className={`flex-1 rounded-[1px] transition-all duration-300 ${i < filled ? activeColor : 'bg-gray-800'} ${i < filled ? 'shadow-[0_0_5px_currentColor]' : ''}`}
                            ></div>
                        ))}
                    </div>
                    <div className="font-mono-tech text-[10px] text-white w-12 text-right">
                        {current}/{total}
                    </div>
                </div>
            );
        };

        // --- COMPONENT: Ipsative Sorting Card ---
        const IpsativeCard = ({ onComplete, questionId, stem, options, isContextPhase }) => {
            const [ranks, setRanks] = useState({}); // { optionId: rankValue } (1-4)
            const [step, setStep] = useState(0); // 0: Pick Most, 1: Pick Least, 2: Auto-fill mid
            const [isAnimating, setIsAnimating] = useState(false);

            // Options data (Mock from backend logic)
            // In real app, these are shuffled
            
            const handleSelection = (optionId) => {
                if (ranks[optionId] || isAnimating) return;

                const newRanks = { ...ranks };
                
                // Smart Interaction Logic:
                // Step 0: User picks "Most Like Me" (Rank 4)
                // Step 1: User picks "Least Like Me" (Rank 1)
                // Remaining 2 options: UI asks "Which is More?" or we simplify for proto
                
                // For this prototype, let's do a fast 4-step click or keyboard
                // Order of assignment: 4 (Most), 1 (Least), 3 (Second Most), 2 (Remaining)
                
                let rankToAssign = 0;
                if (step === 0) rankToAssign = 4;
                else if (step === 1) rankToAssign = 1;
                else if (step === 2) rankToAssign = 3;
                
                if (rankToAssign > 0) {
                    newRanks[optionId] = rankToAssign;
                    setRanks(newRanks);
                    
                    if (step === 2) {
                        // Auto-assign the last remaining one to 2
                        const remaining = options.find(o => !newRanks[o.id] && o.id !== optionId);
                        if (remaining) {
                            newRanks[remaining.id] = 2;
                            setRanks(newRanks);
                        }
                        setIsAnimating(true);
                        setTimeout(onComplete, 600); // Wait for animation then next
                    } else {
                        setStep(prev => prev + 1);
                    }
                }
            };

            const getRankLabel = (rank) => {
                if (rank === 4) return "MOST LIKE ME";
                if (rank === 1) return "LEAST LIKE ME";
                if (rank === 3) return "MORE";
                if (rank === 2) return "LESS";
                return "";
            };

            const getRankColor = (rank) => {
                if (rank === 4) return "bg-green-500 text-black border-green-500";
                if (rank === 1) return "bg-red-500 text-white border-red-500";
                return "bg-gray-700 text-gray-300 border-gray-600";
            };

            // Keyboard Shortcuts: 1, 2, 3, 4 map to the visual options top-down
            useEffect(() => {
                const handleKey = (e) => {
                    const key = parseInt(e.key);
                    if (key >= 1 && key <= 4) {
                        const targetOption = options[key - 1];
                        if (targetOption) handleSelection(targetOption.id);
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [step, ranks]); // Re-bind on state change

            return (
                <div className={`w-full max-w-4xl mx-auto flex flex-col h-full ${isAnimating ? 'card-exit' : 'card-enter'}`}>
                    
                    {/* STEM (Question) */}
                    <div className="mb-8 text-center relative">
                        {isContextPhase && (
                            <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 text-[10px] font-mono-tech text-purple-400 tracking-[0.2em] uppercase bg-purple-500/10 px-2 py-1 rounded border border-purple-500/20">
                                Context: {stem.category}
                            </div>
                        )}
                        <h2 className="text-3xl md:text-4xl font-light text-white leading-tight">
                            {stem.text}
                        </h2>
                        <div className="mt-4 text-sm text-gray-500 font-mono-tech">
                            {step === 0 && <span className="text-green-400 animate-pulse">Select choice MOST like you</span>}
                            {step === 1 && <span className="text-red-400 animate-pulse">Select choice LEAST like you</span>}
                            {step === 2 && <span className="text-blue-400 animate-pulse">Select choice MORE like you</span>}
                            {step > 2 && <span className="text-gray-400">Processing...</span>}
                        </div>
                    </div>

                    {/* OPTIONS GRID */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
                        {options.map((opt, idx) => {
                            const rank = ranks[opt.id];
                            const isSelected = rank !== undefined;
                            
                            return (
                                <div 
                                    key={opt.id}
                                    onClick={() => handleSelection(opt.id)}
                                    className={`
                                        relative p-6 rounded-xl border backdrop-blur-sm cursor-pointer transition-all duration-200 group
                                        ${isSelected 
                                            ? 'border-transparent bg-gray-800/50 opacity-80 scale-[0.98]' 
                                            : 'border-gray-700 bg-black/40 hover:border-gray-500 hover:bg-gray-800/60'
                                        }
                                    `}
                                >
                                    {/* Keyboard Hint */}
                                    <div className={`
                                        absolute top-4 left-4 w-6 h-6 rounded flex items-center justify-center text-xs font-mono font-bold border transition-colors
                                        ${isSelected ? 'border-transparent text-transparent' : 'border-gray-600 text-gray-500 group-hover:border-gray-400 group-hover:text-white'}
                                    `}>
                                        {idx + 1}
                                    </div>

                                    {/* Text */}
                                    <div className="pl-8 pr-2">
                                        <p className={`text-lg transition-colors ${isSelected ? 'text-gray-500' : 'text-gray-200 group-hover:text-white'}`}>
                                            {opt.text}
                                        </p>
                                    </div>

                                    {/* Rank Badge (Result) */}
                                    <div className={`
                                        absolute top-4 right-4 px-3 py-1 rounded text-[10px] font-bold tracking-widest uppercase border shadow-lg rank-badge
                                        ${isSelected ? 'scale-in ' + getRankColor(rank) : 'hidden'}
                                    `}>
                                        {getRankLabel(rank)}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [sessionState, setSessionState] = useState({
                currentIdx: 0,
                phase: 'abstract', // 'abstract' (1-12) or 'context' (13-20)
                responses: {}
            });

            // Mock Data Generator
            const currentItem = {
                id: sessionState.currentIdx + 1,
                stem: sessionState.phase === 'abstract' 
                    ? { text: "When I learn something new..." }
                    : { text: "When facing a tight deadline...", category: "Working Under Pressure" },
                options: [
                    { id: 'opt1', text: "I analyze the logic and principles involved." },
                    { id: 'opt2', text: "I rely on my intuition and feelings." },
                    { id: 'opt3', text: "I look for practical applications immediately." },
                    { id: 'opt4', text: "I observe and reflect before acting." }
                ] // In real app, these map to AC, CE, AE, RO
            };

            const handleItemComplete = () => {
                const nextIdx = sessionState.currentIdx + 1;
                // Transition Logic: Item 12 -> 13 switches phase
                const nextPhase = nextIdx >= 12 ? 'context' : 'abstract';
                
                setSessionState(prev => ({
                    ...prev,
                    currentIdx: nextIdx,
                    phase: nextPhase
                }));
            };

            // Tunnel visuals change based on phase
            const tunnelColor = sessionState.phase === 'context' ? 0xa855f7 : 0x0ea5e9;
            const tunnelIntensity = sessionState.phase === 'context' ? 1.5 : 1.0;

            return (
                <div className="w-screen h-screen bg-dots bg-[#1e1e1e] flex items-center justify-center overflow-hidden">
                    {/* Device Mockup */}
                    <div className="relative w-[1200px] h-[800px] bg-black rounded-lg shadow-2xl border border-gray-800 flex flex-col overflow-hidden">
                        
                        {/* Status Bar */}
                        <div className="h-12 bg-[#121212] border-b border-gray-800 flex items-center px-6 justify-between z-20 relative">
                            <div className="flex items-center gap-2">
                                <div className={`w-2 h-2 rounded-full animate-pulse ${sessionState.phase === 'context' ? 'bg-purple-500' : 'bg-green-500'}`}></div>
                                <span className="text-[10px] font-mono-tech text-gray-400 tracking-widest uppercase">
                                    {sessionState.phase === 'context' ? 'PHASE 2: CONTEXTUAL' : 'PHASE 1: ABSTRACT'}
                                </span>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-[10px] font-mono-tech text-gray-600">ID: 8X-992</div>
                                <div className="h-4 w-[1px] bg-gray-800"></div>
                                <div className="text-[10px] font-bold text-gray-500">CITRIX <span className="font-normal text-gray-700">SECURE</span></div>
                            </div>
                        </div>

                        {/* Immersive Area */}
                        <div className="relative flex-1 bg-black flex flex-col p-8 md:p-12 overflow-hidden">
                            <FocusTunnel intensity={tunnelIntensity} color={tunnelColor} />
                            
                            {/* Content Layer */}
                            <div className="relative z-10 w-full h-full flex flex-col">
                                <TelemetryBar 
                                    current={sessionState.currentIdx + 1} 
                                    total={20} 
                                    phase={sessionState.phase}
                                />
                                
                                <div className="flex-1 flex items-center justify-center">
                                    <IpsativeCard 
                                        key={sessionState.currentIdx} // Force re-render on change
                                        stem={currentItem.stem}
                                        options={currentItem.options}
                                        isContextPhase={sessionState.phase === 'context'}
                                        onComplete={handleItemComplete}
                                    />
                                </div>
                            </div>

                        </div>
                    </div>

                    {/* UX Notes for Prototype Review */}
                    <div className="absolute top-1/2 -translate-y-1/2 right-8 w-64 space-y-4">
                        <div className="bg-[#27272a] p-4 rounded border-l-4 border-green-500 shadow-xl opacity-90">
                            <h4 className="text-xs font-bold text-gray-300 mb-1">IPSATIVE LOGIC</h4>
                            <p className="text-[10px] text-gray-400 leading-relaxed">
                                Backend requires distinct ranks (1-4). UI uses a "Quick Stack" interaction: 
                                <br/>1. Click "Most Like Me"
                                <br/>2. Click "Least Like Me"
                                <br/>3. Tie-break remainder.
                            </p>
                        </div>
                        <div className="bg-[#27272a] p-4 rounded border-l-4 border-purple-500 shadow-xl opacity-90">
                            <h4 className="text-xs font-bold text-gray-300 mb-1">PHASE SHIFT</h4>
                            <p className="text-[10px] text-gray-400 leading-relaxed">
                                At Item 13, system detects Context items (LFI). Visuals shift to Purple/High-Intensity to reset user attention.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
