<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenotika - The Tower (Admin Console)</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: #0b0c0e;
            --border-color: rgba(255, 255, 255, 0.08);
            --citrix-blue: #0ea5e9;
            --zenotika-purple: #a855f7;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .font-mono-tech { font-family: 'JetBrains Mono', monospace; letter-spacing: -0.05em; }
        .font-header { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        /* --- UI COMPONENTS --- */

        /* 1. Technical Sidebar */
        .sidebar {
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
        }

        /* 2. Glass Table Rows */
        .table-row {
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        .table-row:hover {
            background: rgba(14, 165, 233, 0.05);
        }

        /* 3. Status Indicators */
        .status-dot {
            box-shadow: 0 0 8px currentColor;
        }

        /* 4. Command Palette Overlay */
        .cmd-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        /* 5. Pipeline Node */
        .pipeline-node {
            background: #151518;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        .pipeline-node.active {
            border-color: var(--citrix-blue);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.2);
        }
        .pipeline-connector {
            background: var(--border-color);
            transition: background 0.5s;
        }
        .pipeline-connector.active {
            background: var(--citrix-blue);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 16, className }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- COMPONENT: SCORING PIPELINE VISUALIZER ---
        // Visualizes the logic found in plugin.py/seeds.py (Raw -> Combination -> Style -> LFI -> Percentiles)
        const PipelineVisualizer = () => {
            const steps = [
                { id: "RAW", label: "Raw Scales", status: "success" },
                { id: "COMB", label: "Combinations", status: "success" },
                { id: "STYLE", label: "Style Assign", status: "processing" },
                { id: "LFI", label: "LFI Compute", status: "waiting" },
                { id: "NORM", label: "Percentiles", status: "waiting" }
            ];

            return (
                <div className="w-full h-32 flex items-center justify-between px-10 relative">
                    {/* Connecting Line */}
                    <div className="absolute top-1/2 left-10 right-10 h-[2px] bg-[#222] -z-10"></div>
                    
                    {steps.map((step, i) => {
                        const isActive = step.status === "processing";
                        const isDone = step.status === "success";
                        const colorClass = isDone ? "border-green-500 text-green-500" : isActive ? "border-citrix-blue text-citrix-blue animate-pulse" : "border-gray-700 text-gray-600";
                        const bgClass = isDone ? "bg-green-500/10" : isActive ? "bg-blue-500/10" : "bg-[#151518]";

                        return (
                            <div key={step.id} className="flex flex-col items-center gap-3 bg-dark z-10">
                                <div className={`w-12 h-12 rounded flex items-center justify-center border ${colorClass} ${bgClass} font-mono-tech font-bold text-xs`}>
                                    {isDone ? <Icon name="check" size={14} /> : i + 1}
                                </div>
                                <div className="text-[10px] font-mono-tech uppercase text-gray-500 tracking-wider bg-black px-2">
                                    {step.label}
                                </div>
                            </div>
                        )
                    })}
                </div>
            );
        };

        // --- COMPONENT: TELEMETRY GRID (TEAMS) ---
        const TeamGrid = () => {
            // Mock data based on sessions.py
            const members = [
                { id: "USR-001", name: "Alex Pilot", role: "Squad Lead", status: "completed", lastActive: "2m ago", style: "Initiating" },
                { id: "USR-002", name: "Sarah Chen", role: "Researcher", status: "in_progress", lastActive: "Just now", style: "--" },
                { id: "USR-003", name: "Marcus O.", role: "Contributor", status: "invited", lastActive: "1d ago", style: "--" },
                { id: "USR-004", name: "Priya D.", role: "Contributor", status: "completed", lastActive: "3h ago", style: "Balancing" },
                { id: "USR-005", name: "Tom H.", role: "Observer", status: "idle", lastActive: "5m ago", style: "--" },
            ];

            const getStatusBadge = (status) => {
                const map = {
                    completed: { color: "text-green-400 bg-green-400/10", label: "Finalized" },
                    in_progress: { color: "text-blue-400 bg-blue-400/10", label: "Tunnel Active" },
                    invited: { color: "text-gray-400 bg-gray-400/10", label: "Pending" },
                    idle: { color: "text-yellow-400 bg-yellow-400/10", label: "Idle" }
                };
                const s = map[status] || map.invited;
                return <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase font-mono-tech ${s.color}`}>{s.label}</span>;
            };

            return (
                <div className="w-full">
                    {/* Toolbar */}
                    <div className="flex justify-between items-center mb-4 px-1">
                        <div className="flex gap-2">
                            <input type="text" placeholder="Filter by ID or Name..." className="bg-[#151518] border border-white/10 rounded px-3 py-1.5 text-xs text-white w-64 focus:border-citrix-blue outline-none transition-colors font-mono-tech" />
                            <button className="px-3 py-1.5 bg-[#151518] border border-white/10 rounded text-xs text-gray-400 hover:text-white flex items-center gap-2">
                                <Icon name="filter" size={12} /> Filter
                            </button>
                        </div>
                        <div className="flex gap-2">
                            <button className="px-3 py-1.5 bg-citrix-blue text-black font-bold text-xs uppercase tracking-wider rounded hover:bg-white transition-colors flex items-center gap-2">
                                <Icon name="user-plus" size={12} /> Add Member
                            </button>
                        </div>
                    </div>

                    {/* Table Header */}
                    <div className="grid grid-cols-12 px-4 py-2 border-b border-white/10 text-[10px] uppercase font-mono-tech text-gray-500 tracking-widest">
                        <div className="col-span-1">ID</div>
                        <div className="col-span-3">User</div>
                        <div className="col-span-2">Role</div>
                        <div className="col-span-2">Status</div>
                        <div className="col-span-2">Result</div>
                        <div className="col-span-2 text-right">Activity</div>
                    </div>

                    {/* Table Body */}
                    <div className="flex flex-col">
                        {members.map((m) => (
                            <div key={m.id} className="grid grid-cols-12 px-4 py-3 table-row items-center text-sm group cursor-pointer">
                                <div className="col-span-1 font-mono-tech text-gray-500 text-xs">{m.id.split('-')[1]}</div>
                                <div className="col-span-3 font-medium text-white flex items-center gap-3">
                                    <div className="w-6 h-6 rounded bg-gray-800 border border-white/10 flex items-center justify-center text-xs font-bold text-gray-400">
                                        {m.name[0]}
                                    </div>
                                    {m.name}
                                </div>
                                <div className="col-span-2 text-gray-400 text-xs">{m.role}</div>
                                <div className="col-span-2">{getStatusBadge(m.status)}</div>
                                <div className="col-span-2 font-header text-gray-300 text-sm tracking-wide">{m.style}</div>
                                <div className="col-span-2 text-right font-mono-tech text-xs text-gray-500 group-hover:text-citrix-blue">{m.lastActive}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- COMPONENT: SYSTEM HEALTH (METRICS) ---
        const MetricCard = ({ label, value, sub, status }) => (
            <div className="p-4 bg-[#151518] border border-white/5 rounded flex flex-col justify-between h-24 relative overflow-hidden group">
                <div className="flex justify-between items-start z-10">
                    <span className="font-mono-tech text-[9px] uppercase text-gray-500 tracking-wider">{label}</span>
                    <Icon name={status === 'good' ? 'activity' : 'alert-circle'} size={12} className={status === 'good' ? 'text-green-500' : 'text-red-500'} />
                </div>
                <div className="z-10">
                    <div className="font-header text-2xl text-white">{value}</div>
                    <div className="font-mono-tech text-[10px] text-gray-400 mt-1">{sub}</div>
                </div>
                {/* Background Decoration */}
                <div className="absolute -right-4 -bottom-4 w-16 h-16 bg-white/5 rounded-full blur-xl group-hover:bg-citrix-blue/10 transition-colors"></div>
            </div>
        );

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('teams'); // teams, research, pipelines
            const [sidebarCollapsed, setSidebarCollapsed] = useState(true);

            return (
                <div className="flex w-screen h-screen bg-bg-dark">
                    
                    {/* SIDEBAR */}
                    <aside className={`sidebar flex flex-col justify-between transition-all duration-300 ${sidebarCollapsed ? 'w-16' : 'w-64'}`}>
                        <div>
                            {/* Logo Area */}
                            <div className="h-16 flex items-center justify-center border-b border-white/5">
                                <div className="w-8 h-8 bg-white text-black font-header font-bold flex items-center justify-center text-xl rounded-sm">
                                    Z
                                </div>
                            </div>

                            {/* Nav Items */}
                            <nav className="flex flex-col gap-1 p-2 mt-4">
                                {[
                                    { id: 'dashboard', icon: 'layout-dashboard', label: 'Overview' },
                                    { id: 'teams', icon: 'users', label: 'Squads' },
                                    { id: 'research', icon: 'flask-conical', label: 'Research' },
                                    { id: 'pipelines', icon: 'git-branch', label: 'Pipelines' },
                                    { id: 'settings', icon: 'settings', label: 'Config' },
                                ].map((item) => (
                                    <button 
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`
                                            flex items-center gap-3 p-3 rounded transition-all
                                            ${activeTab === item.id ? 'bg-citrix-blue/10 text-citrix-blue border border-citrix-blue/20' : 'text-gray-500 hover:text-white hover:bg-white/5'}
                                        `}
                                        title={item.label}
                                    >
                                        <Icon name={item.icon} size={18} />
                                        {!sidebarCollapsed && <span className="text-sm font-medium">{item.label}</span>}
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {/* Bottom Actions */}
                        <div className="p-2 border-t border-white/5">
                             <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} className="w-full p-3 flex items-center justify-center text-gray-500 hover:text-white transition-colors">
                                <Icon name={sidebarCollapsed ? 'chevron-right' : 'chevron-left'} size={16} />
                            </button>
                        </div>
                    </aside>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 flex flex-col min-w-0">
                        
                        {/* HEADER */}
                        <header className="h-16 border-b border-white/5 flex items-center justify-between px-6 bg-panel-bg">
                            <div className="flex items-center gap-4">
                                <h1 className="font-header text-xl text-white tracking-wide">
                                    {activeTab === 'teams' && 'Squad Management'}
                                    {activeTab === 'research' && 'Research Protocols'}
                                    {activeTab === 'pipelines' && 'Scoring Logic'}
                                    {activeTab === 'dashboard' && 'System Overview'}
                                </h1>
                                <div className="h-4 w-[1px] bg-white/10"></div>
                                <span className="font-mono-tech text-xs text-green-500 flex items-center gap-1">
                                    <span className="w-1.5 h-1.5 rounded-full bg-green-500 status-dot"></span>
                                    SYSTEM OPTIMAL
                                </span>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-[#151518] border border-white/10 rounded text-xs text-gray-400 font-mono-tech">
                                    <span className="text-white">⌘ K</span> <span>COMMAND</span>
                                </div>
                                <div className="w-8 h-8 rounded bg-purple-600 flex items-center justify-center text-xs font-bold text-white border border-white/20">
                                    AD
                                </div>
                            </div>
                        </header>

                        {/* DASHBOARD CONTENT SCROLLABLE */}
                        <div className="flex-1 overflow-y-auto p-6">
                            
                            {/* Top Metrics Row */}
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                                <MetricCard label="Active Sessions" value="1,248" sub="+12% from last week" status="good" />
                                <MetricCard label="Avg. Latency" value="42ms" sub="Global Edge" status="good" />
                                <MetricCard label="Completion Rate" value="89.2%" sub="Tunnel Experience" status="good" />
                                <MetricCard label="API Errors" value="0.01%" sub="Last 24h" status="good" />
                            </div>

                            {/* Main Workspace */}
                            <div className="bg-panel-bg border border-white/5 rounded-lg overflow-hidden min-h-[500px]">
                                {activeTab === 'teams' && <TeamGrid />}
                                
                                {activeTab === 'pipelines' && (
                                    <div className="p-6">
                                        <div className="mb-8">
                                            <h3 className="font-header text-lg text-white mb-2">KLSI 4.0 Standard Pipeline</h3>
                                            <p className="text-sm text-gray-500 font-light max-w-2xl">
                                                Active scoring configuration. Logic defined in <code>seeds.py</code>. 
                                                Modifying nodes will trigger a version increment (v1.2 -> v1.3).
                                            </p>
                                        </div>
                                        <div className="bg-[#050505] border border-white/5 rounded-lg p-8">
                                            <PipelineVisualizer />
                                        </div>
                                        
                                        <div className="mt-8 grid grid-cols-2 gap-8">
                                            <div className="p-4 border border-white/5 rounded bg-[#151518]">
                                                <h4 className="font-mono-tech text-xs uppercase text-citrix-blue mb-4">Rule Definitions</h4>
                                                <div className="space-y-2 font-mono-tech text-[10px] text-gray-400">
                                                    <div className="flex justify-between p-2 bg-black/20 rounded">
                                                        <span>RAW_SUM_CE</span>
                                                        <span className="text-white">RuleType.sum</span>
                                                    </div>
                                                    <div className="flex justify-between p-2 bg-black/20 rounded">
                                                        <span>DIFF_ACCE</span>
                                                        <span className="text-white">RuleType.diff</span>
                                                    </div>
                                                     <div className="flex justify-between p-2 bg-black/20 rounded">
                                                        <span>NORM_LOOKUP</span>
                                                        <span className="text-white">DB.Percentile</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="p-4 border border-white/5 rounded bg-[#151518]">
                                                 <h4 className="font-mono-tech text-xs uppercase text-purple-500 mb-4">Deployment Log</h4>
                                                 <div className="space-y-3 pl-2 border-l border-white/10">
                                                     <div className="text-[10px]">
                                                         <span className="text-gray-500">10:42 AM</span>
                                                         <div className="text-white">Hotfix deployed to Norms Cache</div>
                                                     </div>
                                                     <div className="text-[10px]">
                                                         <span className="text-gray-500">09:00 AM</span>
                                                         <div className="text-white">Daily Cron: Cleanup orphaned sessions</div>
                                                     </div>
                                                 </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab !== 'teams' && activeTab !== 'pipelines' && (
                                    <div className="h-full flex flex-col items-center justify-center text-gray-600 py-20">
                                        <Icon name="construction" size={48} className="mb-4 opacity-20" />
                                        <div className="font-header text-xl opacity-50">Module Under Construction</div>
                                    </div>
                                )}
                            </div>
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
