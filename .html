<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenotika - High Fidelity Prototype (Red Bull Style)</title>
    
    <!-- Fonts: Menggunakan Oswald untuk mimic Red Bull Racing Font (DIN-like) dan Inter untuk Citrix-like UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Three.js -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-figjam: #1e1e1e;
            --zenotika-purple: #a855f7;
            --citrix-blue: #0ea5e9;
        }

        body {
            background-color: var(--bg-figjam);
            color: white;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* Typography Mapping to Reference */
        .font-headline { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; } /* Red Bull Style */
        .font-ui { font-family: 'Inter', sans-serif; letter-spacing: 0.05em; }

        /* FigJam Pattern */
        .bg-dots {
            background-image: radial-gradient(#4b4b4b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Custom UI Elements */
        .glass-ui {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Animations */
        @keyframes scroll-line {
            0% { transform: scaleX(0); transform-origin: left; }
            50% { transform: scaleX(1); transform-origin: left; }
            51% { transform: scaleX(1); transform-origin: right; }
            100% { transform: scaleX(0); transform-origin: right; }
        }
        .animate-scroll-line {
            animation: scroll-line 2s cubic-bezier(0.77, 0, 0.175, 1) infinite;
        }

        /* Sound Wave Animation */
        @keyframes sound-wave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .bar-1 { animation: sound-wave 0.8s infinite ease-in-out; }
        .bar-2 { animation: sound-wave 1.1s infinite ease-in-out 0.1s; }
        .bar-3 { animation: sound-wave 0.9s infinite ease-in-out 0.2s; }
        .bar-4 { animation: sound-wave 1.2s infinite ease-in-out 0.3s; }

        .cursor-pointer-custom { cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- WEBGL BACKGROUND (Simulation of the "Fast" Environment) ---
        const SpeedTunnel = () => {
            const mountRef = useRef(null);
            
            useEffect(() => {
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;
                const scene = new THREE.Scene();
                // Add subtle fog to match the atmospheric look of Red Bull site
                scene.fog = new THREE.FogExp2(0x0a0a0a, 0.02); 

                const camera = new THREE.PerspectiveCamera(70, width / height, 0.1, 1000);
                camera.position.z = 5;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(width, height);
                mountRef.current.appendChild(renderer.domElement);

                // Create "Speed Lines" / Particles
                const geometry = new THREE.BufferGeometry();
                const count = 4000;
                const positions = new Float32Array(count * 3);
                
                for(let i=0; i<count; i++) {
                    positions[i*3] = (Math.random() - 0.5) * 40; // x
                    positions[i*3+1] = (Math.random() - 0.5) * 40; // y
                    positions[i*3+2] = (Math.random() - 0.5) * 100; // z
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const material = new THREE.PointsMaterial({
                    color: 0xffffff, // White particles like the dust/smoke in Red Bull
                    size: 0.05,
                    transparent: true,
                    opacity: 0.6,
                });
                
                const particles = new THREE.Points(geometry, material);
                scene.add(particles);

                // Light to simulate the sun/glare in the reference
                const light = new THREE.PointLight(0x0ea5e9, 2, 50); // Citrix Blue-ish glare
                light.position.set(0, 5, 5);
                scene.add(light);

                const animate = () => {
                    requestAnimationFrame(animate);
                    
                    // Move particles to create speed effect
                    const positions = particles.geometry.attributes.position.array;
                    for(let i=0; i<count; i++) {
                        positions[i*3+2] += 0.3; // Speed z
                        if(positions[i*3+2] > 5) {
                            positions[i*3+2] = -50;
                        }
                    }
                    particles.geometry.attributes.position.needsUpdate = true;
                    
                    // Gentle camera sway
                    camera.position.x += (Math.sin(Date.now() * 0.001) * 0.001);
                    camera.rotation.z += 0.0002;

                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                   if(mountRef.current) mountRef.current.innerHTML = '';
                };
            }, []);

            return <div ref={mountRef} className="absolute inset-0 z-0 bg-gradient-to-b from-[#1a1a1a] to-[#050505]" />;
        };

        // --- THE LANDING PAGE COMPONENT (The "Artboard") ---
        const LandingPageDesign = () => {
            return (
                <div className="relative w-full h-full overflow-hidden flex flex-col justify-between selection:bg-blue-500 selection:text-white">
                    <SpeedTunnel />
                    
                    {/* TOP NAV - 100% Layout Match: Logo Left, Sound/Menu Right */}
                    <header className="relative z-10 w-full px-12 py-8 flex justify-between items-start">
                        {/* Logo Area */}
                        <div>
                            <h1 className="font-headline text-2xl font-bold tracking-tighter text-white">
                                ZENOTIKA<span className="text-blue-400">™</span>
                            </h1>
                            <p className="font-ui text-[9px] uppercase tracking-[0.2em] text-gray-400 mt-1">Innovation Partner</p>
                        </div>

                        {/* Right Controls */}
                        <div className="flex items-center gap-10">
                            {/* Sound Toggle */}
                            <div className="flex items-center gap-3 cursor-pointer group">
                                <div className="flex items-end gap-[3px] h-4">
                                    <div className="w-[2px] bg-white bar-1"></div>
                                    <div className="w-[2px] bg-white bar-2"></div>
                                    <div className="w-[2px] bg-white bar-3"></div>
                                    <div className="w-[2px] bg-white bar-4"></div>
                                </div>
                                <span className="font-ui text-[10px] font-bold uppercase tracking-widest text-white group-hover:text-blue-400 transition-colors">Sound</span>
                            </div>

                            {/* Menu Dots */}
                            <div className="flex gap-1.5 cursor-pointer">
                                <div className="w-1.5 h-1.5 bg-white rounded-full"></div>
                                <div className="w-1.5 h-1.5 bg-white rounded-full opacity-50"></div>
                                <div className="w-1.5 h-1.5 bg-white rounded-full opacity-50"></div>
                            </div>
                        </div>
                    </header>

                    {/* MAIN HERO CONTENT - Centered Left */}
                    <main className="relative z-10 px-12 md:px-16 w-full max-w-[90%]">
                        <div className="relative">
                            {/* The "Smoke" effect behind text (CSS Gradient) */}
                            <div className="absolute -left-20 -top-20 w-[600px] h-[300px] bg-blue-500/10 blur-[100px] rounded-full pointer-events-none"></div>

                            {/* Main Headline - Oswald Font, Uppercase, White */}
                            <h2 className="font-headline text-[6rem] leading-[0.9] text-white uppercase mb-8 drop-shadow-2xl">
                                HOW DO YOU <br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">QUANTIFY</span> <br />
                                HUMAN POTENTIAL?
                            </h2>
                        </div>
                    </main>

                    {/* FOOTER AREA - Layout Match */}
                    <footer className="relative z-10 px-12 pb-12 pt-0 w-full flex items-end justify-between">
                        {/* Bottom Left: Context / Logos */}
                        <div className="flex items-center gap-6">
                            <div className="text-right border-r border-gray-600 pr-6">
                                <div className="font-headline font-bold text-lg leading-none">ZENOTIKA</div>
                                <div className="font-ui text-[8px] tracking-widest uppercase text-gray-400"></div>
                            </div>
                            <div className="text-left">
                                <div className="font-headline font-bold text-lg leading-none text-blue-400">UNIKOM</div>
                                <div className="font-ui text-[8px] tracking-widest uppercase text-gray-400"></div>
                            </div>
                            
                            {/* Descriptive Text (Like the reference paragraph) */}
                            <div className="max-w-md ml-8 hidden md:block">
                                <p className="font-ui text-sm text-gray-300 leading-relaxed">
                                    Zenotika is helping global leaders reimagine how they assess talent in the tunnel, the boardroom, and everywhere in between. This is how the future works.
                                </p>
                            </div>
                        </div>

                        {/* Bottom Right: Scroll to Explore */}
                        <div className="flex items-center gap-4 group cursor-pointer">
                            <span className="font-ui text-[10px] font-bold uppercase tracking-[0.2em] text-white group-hover:text-blue-400 transition-colors">
                                Scroll to Explore
                            </span>
                            <div className="relative w-16 h-[1px] bg-gray-700 overflow-hidden">
                                <div className="absolute inset-0 bg-white animate-scroll-line"></div>
                            </div>
                            <Icon name="arrow-right" size={16} className="text-white" />
                        </div>
                    </footer>
                </div>
            );
        };

        // --- FIGJAM CANVAS COMPONENTS ---

        const CommentCard = ({ x, y, author, avatar, text, color }) => (
            <div 
                className="absolute w-64 p-4 rounded-lg shadow-2xl z-50 pointer-events-none transform transition-transform hover:scale-105"
                style={{ left: x, top: y, backgroundColor: '#27272a', borderLeft: `4px solid ${color}` }}
            >
                <div className="flex items-center gap-3 mb-2">
                    <img src={avatar} className="w-8 h-8 rounded-full border border-white/10" />
                    <div>
                        <div className="font-bold text-xs text-white">{author}</div>
                        <div className="text-[9px] text-gray-400 uppercase">Awwwards Jury</div>
                    </div>
                </div>
                <div className="font-ui text-xs text-gray-300 leading-relaxed">"{text}"</div>
            </div>
        );

        const AssetPanel = () => (
            <div className="absolute top-20 left-10 w-56 bg-[#18181b] border border-gray-800 rounded-xl p-4 shadow-xl z-40">
                <div className="font-ui text-[10px] font-bold uppercase text-gray-500 mb-4 tracking-widest border-b border-gray-800 pb-2">
                    Assets / Styles
                </div>
                
                {/* Typography */}
                <div className="mb-6">
                    <div className="text-[10px] text-gray-500 mb-2">HEADLINE FONT</div>
                    <div className="font-headline text-2xl text-white mb-1">Oswald</div>
                    <div className="text-[10px] text-gray-400">Used for: Hero, Big Data</div>
                </div>

                <div className="mb-6">
                    <div className="text-[10px] text-gray-500 mb-2">UI FONT</div>
                    <div className="font-ui text-lg text-white mb-1">Inter</div>
                    <div className="text-[10px] text-gray-400">Used for: Nav, Body, Meta</div>
                </div>

                {/* Colors */}
                <div>
                    <div className="text-[10px] text-gray-500 mb-2">PALETTE</div>
                    <div className="flex gap-2">
                        <div className="w-8 h-8 rounded bg-white border border-gray-700" title="White"></div>
                        <div className="w-8 h-8 rounded bg-[#1a1a1a] border border-gray-700" title="Carbon"></div>
                        <div className="w-8 h-8 rounded bg-[#0ea5e9]" title="Citrix Blue"></div>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [scale, setScale] = useState(0.85);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [startPos, setStartPos] = useState({ x: 0, y: 0 });

            const handleMouseDown = (e) => {
                if(e.target.closest('.interactive-area')) return;
                setIsDragging(true);
                setStartPos({ x: e.clientX - pan.x, y: e.clientY - pan.y });
            };
            
            const handleMouseMove = (e) => {
                if(isDragging) {
                    setPan({ x: e.clientX - startPos.x, y: e.clientY - startPos.y });
                }
            };
            
            const handleMouseUp = () => setIsDragging(false);
            const handleWheel = (e) => {
                if(e.ctrlKey) {
                    e.preventDefault();
                    setScale(s => Math.min(Math.max(s - e.deltaY * 0.001, 0.4), 1.5));
                } else {
                    setPan(p => ({ x: p.x - e.deltaX, y: p.y - e.deltaY }));
                }
            };

            return (
                <div 
                    className="w-screen h-screen overflow-hidden bg-dots text-white relative cursor-grab active:cursor-grabbing"
                    onMouseDown={handleMouseDown}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onWheel={handleWheel}
                    style={{ backgroundColor: '#1e1e1e' }}
                >
                    {/* UI Header */}
                    <div className="absolute top-0 left-0 w-full h-12 bg-[#2a2a2a] border-b border-[#3f3f3f] flex items-center px-4 justify-between z-50">
                        <div className="flex items-center gap-4">
                            <div className="font-ui font-bold text-sm">Zenotika_Landing_Ref_v2.fig</div>
                            <span className="px-2 py-0.5 bg-green-500/20 text-green-400 text-[10px] rounded border border-green-500/30">HIFI APPROVED</span>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="flex -space-x-2">
                                <img src="https://i.pravatar.cc/100?img=11" className="w-6 h-6 rounded-full border border-[#2a2a2a]" />
                                <img src="https://i.pravatar.cc/100?img=59" className="w-6 h-6 rounded-full border border-[#2a2a2a]" />
                                <div className="w-6 h-6 rounded-full bg-blue-600 border border-[#2a2a2a] flex items-center justify-center text-[9px] font-bold">You</div>
                            </div>
                            <button className="bg-blue-600 hover:bg-blue-500 text-xs font-bold px-3 py-1.5 rounded text-white transition-colors">Share Prototype</button>
                        </div>
                    </div>

                    {/* Canvas Content */}
                    <div 
                        className="w-full h-full flex items-center justify-center transform-gpu origin-center transition-transform duration-75"
                        style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${scale})` }}
                    >
                        {/* THE ARTBOARD (Browser Window Mockup) */}
                        <div className="relative w-[1400px] h-[850px] bg-black shadow-2xl rounded-lg overflow-hidden border border-gray-800 interactive-area">
                            {/* Browser Chrome */}
                            <div className="h-8 bg-[#121212] flex items-center px-3 gap-2 border-b border-gray-800">
                                <div className="flex gap-1.5">
                                    <div className="w-2.5 h-2.5 rounded-full bg-[#ff5f56]"></div>
                                    <div className="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]"></div>
                                    <div className="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></div>
                                </div>
                                <div className="ml-4 flex-1 text-center text-[10px] text-gray-500 font-mono">zenotika.com/future-workforce</div>
                            </div>
                            
                            {/* Actual Landing Design */}
                            <LandingPageDesign />
                        </div>

                        {/* Annotations / Comments */}
                        <AssetPanel />
                        
                        <CommentCard 
                            x={-300} y={100} 
                            author="Thieb" 
                            avatar="https://i.pravatar.cc/100?img=11" 
                            text="Placement tipografi Headline sudah 100% akurat dengan referensi. Jarak kerning pada 'QUANTIFY' terasa sangat editorial."
                            color="#3b82f6"
                        />
                         <CommentCard 
                            x={1150} y={600} 
                            author="Kenta" 
                            avatar="https://i.pravatar.cc/100?img=59" 
                            text="Motion pada partikel background sudah mensimulasikan kecepatan F1 tapi dalam konteks 'Data Tunnel'. Sangat imersif."
                            color="#eab308"
                        />
                         <CommentCard 
                            x={-250} y={650} 
                            author="Michele" 
                            avatar="https://i.pravatar.cc/100?img=32" 
                            text="CTA 'Scroll to Explore' dengan garis animasi di kanan bawah adalah sentuhan UX yang brilian dari referensi asli."
                            color="#f97316"
                        />

                        {/* Connection Lines (Overlay SVG) */}
                        <svg className="absolute inset-0 pointer-events-none" style={{ overflow: 'visible' }}>
                            <path d="M -40 140 C 50 140, 100 200, 150 300" stroke="#3b82f6" strokeWidth="2" fill="none" strokeDasharray="5,5" opacity="0.5" />
                            <path d="M 1150 640 C 1000 640, 900 600, 800 500" stroke="#eab308" strokeWidth="2" fill="none" strokeDasharray="5,5" opacity="0.5" />
                        </svg>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
