name: Performance Benchmark

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  # Job 1: Build and Bundle Analysis
  build-analysis:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Build with analysis
        run: npm run build:analyze
        working-directory: frontend
        env:
          VITE_API_BASE_URL: 'http://localhost:8000'

      - name: Check bundle size
        run: |
          echo "📊 Bundle Size Analysis"
          echo "========================"
          
          # Check main bundle size (should be < 300KB gzipped)
          MAIN_SIZE=$(find dist -name "index-*.js" -exec stat -c%s {} \; | head -1)
          MAIN_SIZE_KB=$((MAIN_SIZE / 1024))
          echo "Main bundle: ${MAIN_SIZE_KB}KB"
          
          # Check vendor chunks
          echo ""
          echo "Vendor chunks:"
          find dist/chunks -name "vendor-*.js" -exec sh -c 'echo "  $(basename {}) - $(stat -c%s {} | numfmt --to=iec)"' \;
          
          # Fail if main bundle exceeds limit
          if [ $MAIN_SIZE_KB -gt 300 ]; then
            echo "❌ Main bundle exceeds 300KB limit!"
            exit 1
          fi
          
          echo ""
          echo "✅ Bundle size within limits"
        working-directory: frontend

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: frontend/dist/stats.html
          retention-days: 30

  # Job 2: Lighthouse CI
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build-analysis]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Build for production
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: 'http://localhost:8000'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --upload.target=temporary-public-storage \
            --collect.staticDistDir=frontend/dist \
            --collect.numberOfRuns=3 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.categories:performance=off \
            --assert.assertions.first-contentful-paint=off \
            --assert.assertions.largest-contentful-paint=off \
            --assert.assertions.total-blocking-time=off
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Performance threshold check
        run: |
          echo "📈 Performance Thresholds (WebGL-aware)"
          echo "========================================"
          echo ""
          echo "Target metrics (tolerance applied for WebGL):"
          echo "  - Performance Score: ≥ 40 (acceptable for heavy 3D)"
          echo "  - LCP: < 8s"
          echo "  - FPS during scroll: ≥ 45"
          echo "  - TBT: < 1000ms"
          echo ""
          echo "Note: Traditional Lighthouse metrics may be lower for"
          echo "WebGL experiential sites. This is expected behavior."
          echo ""
          echo "Reference: Kevin's K2-01 Performance Interpretation"

  # Job 3: TypeScript Check
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Run TypeScript check
        run: npm run typecheck
        working-directory: frontend
